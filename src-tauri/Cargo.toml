[package]
name = "realme-link-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
buds-protocol = { path = "../crates/buds-protocol" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
